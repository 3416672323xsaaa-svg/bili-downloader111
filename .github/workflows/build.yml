name: Build BiliPink APK


on:

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"



    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          git \
          zip \
          unzip \
          openjdk-17-jdk \
          autoconf \
          libtool \
          pkg-config \
          zlib1g-dev \
          libffi-dev \
          libssl-dev


        pip install --upgrade pip


        pip install \
          buildozer==1.5.0 \
          Cython==0.29.36




    - name: Build APK
      run: |

        buildozer android clean

        buildozer -v android debug



    - name: Upload APK
      uses: actions/upload-artifact@v4

      with:

        name: BiliPink-debug

        path: bin/*.apk
