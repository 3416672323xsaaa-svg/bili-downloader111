name: Build BiliPink APK


on:

  push:
    branches:
      - main

  workflow_dispatch:



jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


      - name: Checkout
        uses: actions/checkout@v4



      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"



      - name: Install Buildozer Environment
        run: |

          sudo apt update

          sudo apt install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev


          pip install --upgrade pip


          pip install \
            buildozer==1.5.0 \
            Cython==0.29.36



      - name: Clean Old Build Cache
        run: |

          rm -rf .buildozer

          rm -rf ~/.buildozer



      - name: Build BiliPink APK
        run: |

          buildozer -v android debug



      - name: Upload APK
        uses: actions/upload-artifact@v4

        with:

          name: BiliPink-APK

          path: bin/*.apk
