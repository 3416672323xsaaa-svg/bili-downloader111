name: Build BiliPink Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  P4A_BOOTSTRAP_DOWNLOAD_HOST: https://mirror.ghproxy.com
  PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install system libs
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libssl-dev libffi-dev

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.4.0 cython==0.29.36 python-for-android

      - name: Clean cache
        run: |
          rm -rf .buildozer bin
          buildozer android clean || true

      - name: Build APK
        run: |
          export MAKEFLAGS="-j1"
          buildozer android debug > buildozer_run.log 2>&1

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-APK
          path: bin/*.apk

      - name: Upload Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-build-log
          path: |
            buildozer_run.log
            .buildozer/**/*.log
