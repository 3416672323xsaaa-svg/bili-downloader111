name: Build Kivy Android APK In Debug Mode

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  checks: read


env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

  JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64

  CYTHON_LANGUAGE_LEVEL: "3"

  GRADLE_OPTS: >
    -Dorg.gradle.daemon=false
    -Dorg.gradle.java.home=$JAVA_HOME
    -Dorg.gradle.jvmargs=-Xmx2048m

  P4A_BOOTSTRAP_DOWNLOAD_HOST: https://mirror.ghproxy.com


jobs:

  build-android:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            ~/.gradle
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"


      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libssl-dev \
            libffi-dev \
            libsqlite3-dev \
            libbz2-dev \
            liblzma-dev \
            cmake


      - name: Install Buildozer
        run: |

          python -m pip install --upgrade pip

          pip install \
            buildozer==1.5.0 \
            cython==0.29.36


      - name: Build APK
        run: |

          export MAKEFLAGS="-j1"

          buildozer android debug log_level=2


      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-debug-apk
          path: bin/*.apk
