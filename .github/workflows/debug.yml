on: [push, pull_request]

env:
  PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: 0

name: Android Integration
jobs:
  Integration:
    runs-on: ubuntu-latest
    steps:
    - name: Setup Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.x'
    - name: Setup Java
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: actions/checkout@v7

    - name: Install system deps
      run: sudo apt update && sudo apt install -y autoconf automake libtool pkg-config zlib1g-dev

    - name: Install buildozer & p4a
      run: pip install buildozer python-for-android

    - name: Pre accept all SDK licenses
      run: |
        yes | buildozer android sdk --sdkmanager --licenses

    - name: Build APK
      run: buildozer android debug

    - name: Upload built APK
      uses: actions/upload-artifact@v4
      with:
        name: BiliPink-Debug-APK
        path: bin/*.apk
