name: Android CI Build

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "**"

permissions:
  contents: read

concurrency:
  # Group per ref AND event type: routine pushes to the same branch still cancel
  # their superseded check runs, but a workflow_dispatch packaging run is never
  # cancelled by a merge push landing on the same ref mid-build.
  group: android-ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Basic code check
        run: |
          python -m compileall .

  package-apks:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx1024m"
      P4A_NDK_JOBS: "1"
      MAKEFLAGS: "-j1"
    steps:
      - name: Download code
        uses: actions/checkout@v6

      - name: Prepare Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install needed tools
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "ndk;25.2.9519653"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libssl-dev libsqlite3-dev liblzma-dev libffi-dev ccache

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer==1.5.0 cython==0.29.36 python-for-android

      - name: Clean build cache
        run: |
          rm -rf .buildozer bin
          buildozer android clean || true

      - name: Build APK
        run: |
          export MAKEFLAGS="-j1"
          export P4A_NDK_JOBS=1
          buildozer -v android debug > buildozer_run.log 2>&1 || true

      - name: Show build result
        run: |
          ls -la bin || true
          tail -n 120 buildozer_run.log

      - name: Upload BiliPink APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-apk-${{ github.run_number }}
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-build-log-${{ github.run_number }}
          path: buildozer_run.log
          retention-days: 14
