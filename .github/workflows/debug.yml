name: Build APK
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Kivy APK Build Action
        uses: ./.github/操作/构建 apk

      - name: Upload built APK
        uses: actions/upload-artifact@v4
        with:
          name: BiliPink-Debug-APK
          path: bin/*.apk
